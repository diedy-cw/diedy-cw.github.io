<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天下品牌動畫原始檔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=Roboto:wght@400;500;700&display=swap">
<style>
/* 動畫原始檔：畫面全部由 renderAt(t) 依時間畫出，瀏覽器播放與逐格輸出用同一份程式 */
:root { --bg: #FFFFFF; --fg: #1A1A1A; --fg-2: #48545D; --border: #D3D5D7; --red: #D60C18; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #15181B; --fg: #F1F2F3; --fg-2: #C2C9CF; --border: #3A4148; --red: #F0444D; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #15181B; --fg: #F1F2F3; --fg-2: #C2C9CF; --border: #3A4148; --red: #F0444D; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px 40px; background: var(--bg); color: var(--fg); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 12px; }
canvas { width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; border: 1px solid var(--border); background: #fff; }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--fg-2); }
button { font: inherit; padding: 6px 14px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 4px; cursor: pointer; }
button:hover { border-color: var(--red); }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--red); }
.tc { font-family: Roboto, sans-serif; font-variant-numeric: tabular-nums; min-width: 92px; }
label { display: inline-flex; gap: 6px; align-items: center; }
body.render { padding: 0; }
body.render .wrap { max-width: none; }
body.render .bar { display: none; }
body.render canvas { width: 1920px; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1920" height="1080" role="img" aria-label="天下雜誌品牌影片動畫版，90 秒"></canvas>
  <div class="bar">
    <button id="play" type="button">播放</button>
    <input id="seek" type="range" min="0" max="90" step="0.01" value="0" aria-label="時間">
    <span class="tc" id="tc">0:00.0 / 1:30</span>
    <label><input id="subs" type="checkbox" checked> 字幕</label>
  </div>
</div>
<script>
const W = 1920, H = 1080, DURATION = 90;
const C = {
  bg: "#FFFFFF", ink: "#1A1A1A", g2: "#48545D", g3: "#7D8891", g4: "#939EA7",
  g5: "#B8C0C6", g6: "#D3D5D7", g7: "#EEEEEE", g8: "#F6F7F8", red: "#D60C18"
};
const SANS = '"Noto Sans TC", "PingFang TC", sans-serif';
const SERIF = '"Noto Serif TC", "Songti TC", serif';
const EN = 'Roboto, "Helvetica Neue", Arial, sans-serif';

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let SHOW_SUBS = true;

/* ---------- 共用工具 ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const fade = (t, inA, inB, outA = Infinity, outB = Infinity) => eInOut(prog(t, inA, inB)) * (1 - eInOut(prog(t, outA, outB)));
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}
function mixHex(a, b, k) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(",")})`;
}
function font(size, weight = 400, family = SANS) { return `${weight} ${size}px ${family}`; }
function text(str, x, y, o = {}) {
  ctx.save();
  ctx.font = font(o.size || 40, o.weight || 400, o.family || SANS);
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.baseline || "alphabetic";
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.halo) { ctx.lineJoin = "round"; ctx.strokeStyle = o.haloColor || "#fff"; ctx.lineWidth = o.halo; ctx.strokeText(str, x, y); }
  ctx.fillStyle = o.color || C.ink;
  if (o.spacing) ctx.letterSpacing = o.spacing + "px";
  ctx.fillText(str, x, y);
  ctx.restore();
}
function measure(str, size, weight = 400, family = SANS) { ctx.save(); ctx.font = font(size, weight, family); const w = ctx.measureText(str).width; ctx.restore(); return w; }
/* 浮現：淡入加上少量上移，只用減速收尾 */
function riseText(str, x, y, t, t0, o = {}, dur = .7) {
  const k = eOut(prog(t, t0, t0 + dur));
  if (k <= 0) return;
  text(str, x, y + (1 - k) * 18, { ...o, alpha: (o.alpha ?? 1) * k });
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function polyline(pts, upto = 1) {
  const n = pts.length; const last = (n - 1) * clamp(upto);
  const i = Math.floor(last);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let j = 1; j <= i; j++) ctx.lineTo(pts[j][0], pts[j][1]);
  if (i < n - 1) { const f = last - i; ctx.lineTo(lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)); }
}
function redStroke(w = 6) { ctx.strokeStyle = C.red; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke(); }
function sampleBezier(segs, per = 60) {
  const out = [];
  segs.forEach(([p0, p1, p2, p3], si) => {
    for (let i = si ? 1 : 0; i <= per; i++) {
      const u = i / per, v = 1 - u;
      out.push([v*v*v*p0[0] + 3*v*v*u*p1[0] + 3*v*u*u*p2[0] + u*u*u*p3[0], v*v*v*p0[1] + 3*v*v*u*p1[1] + 3*v*u*u*p2[1] + u*u*u*p3[1]]);
    }
  });
  return out;
}
function offscreen(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; }

/* ---------- 旁白字幕（與分鏡表相同） ---------- */
const VO = [
  [4.3, 7.8, "資訊每天大量湧現。"],
  [8.3, 12.8, "知道得更多，不等於看得更清楚。"],
  [13.3, 17.8, "AI 能在幾秒內給出答案。"],
  [18.3, 23.6, "答案越容易取得，判斷就越重要。"],
  [24.3, 30.6, "一條河的變化，天下持續追蹤 15 年。"],
  [31.3, 36.6, "誰堆出垃圾山？天下循線追查。"],
  [37.3, 43.6, "人名、數字、時間，力求正確無誤。"],
  [44.3, 51.6, "找出問題的真相，提出解決的可能性。"],
  [52.3, 61.6, "天下以 AI 為助力，每一篇內容都經過人工審核、編輯與查證。"],
  [62.3, 68.7, "1981 年創刊至今，"],
  [69.3, 78.6, "天下以積極、前瞻、放眼天下的角度，追求更公平、美好的社會。"],
  [79.3, 83.8, "在紛雜的資訊之中，天下是一束冷靜的聲音。"],
  [84.3, 86.8, "天下，不只是一本雜誌。"]
  /* 最後一句「陪你，看懂天下。」已經是畫面上的標語，不再重複字幕 */
];
function drawSubs(t) {
  if (!SHOW_SUBS) return;
  for (const [a, b, s] of VO) {
    const al = fade(t, a, a + .25, b - .25, b);
    if (al > 0) text(s, W / 2, 1024, { size: 38, weight: 500, align: "center", color: C.ink, alpha: al, halo: 10 });
  }
}

/* ---------- 鏡頭 1–3、13：標題文字牆 ---------- */
const STRIPS = (() => {
  const r = rng(7), out = []; let y = 0;
  const tones = [C.g6, C.g5, C.g4, C.g3];
  while (y < 9600) {
    const dense = clamp((y - 2400) / 2800);
    const gap = lerp(115, 15, dense) * lerp(.8, 1.2, r());
    const h = lerp(14, 26, r()) + dense * 12 * r();
    const x0 = lerp(-40, 360, r()) * (1 - dense * .6);
    const len = lerp(560, 1500, r()) + dense * 600;
    const segs = []; let x = x0;
    while (x < x0 + len) { const w = lerp(24, 150, r()); segs.push([x, w]); x += w + h * .55; }
    out.push({ y, h, segs, tone: tones[Math.floor(r() * tones.length)], a: lerp(.55, .95, r()) });
    y += gap;
  }
  return out;
})();
function wallScroll(t) {
  if (t < 4) return 200 * t + 250 * t * t;                      // 0–4 秒逐漸加速
  const v0 = 2200, u = Math.min(t - 4, 4);                      // 4–8 秒減速到緩慢漂移
  const s = 4800 + v0 * u - (v0 - 100) * u * u / 8;
  return t <= 8 ? s : s + 100 * (t - 8);
}
const wallLayer = document.createElement("canvas"); wallLayer.width = W; wallLayer.height = H;
function sceneOpen(t) {
  const blur = 16 * eInOut(prog(t, 8.6, 12.6));
  const wa = 1 - eInOut(prog(t, 12.6, 13.3));
  const wctx = wallLayer.getContext("2d");
  wctx.clearRect(0, 0, W, H);
  // 在離屏圖層畫文字牆，再整層套用模糊
  drawWallTo(wctx, wallScroll(t));
  ctx.save(); ctx.globalAlpha = wa * (1 - .35 * eInOut(prog(t, 8.6, 12.6)));
  if (blur > .2) ctx.filter = `blur(${blur.toFixed(2)}px)`;
  ctx.drawImage(wallLayer, 0, 0); ctx.restore();
  // 鏡頭 2：關鍵字
  riseText("大量湧現", W / 2, 590, t, 4.5, { size: 200, weight: 900, align: "center", halo: 40, alpha: 1 - eInOut(prog(t, 7.7, 8.2)) }, .8);
  // 鏡頭 3：兩句依旁白出現
  const oa = 1 - eInOut(prog(t, 12.5, 13.2));
  riseText("知道得更多，", W / 2, 470, t, 8.4, { size: 108, weight: 900, align: "center", halo: 30, alpha: oa }, .8);
  riseText("不等於看得更清楚。", W / 2, 630, t, 10.3, { size: 108, weight: 900, align: "center", halo: 30, alpha: oa }, .8);
}
function drawWallTo(c, scroll, alpha = 1) {
  c.save();
  for (const s of STRIPS) {
    const y = H + s.y - scroll;
    if (y < -60 || y > H + 60) continue;
    c.globalAlpha = alpha * s.a; c.fillStyle = s.tone;
    for (const [x, w] of s.segs) c.fillRect(x, y, w, s.h);
  }
  c.restore();
}

/* ---------- 鏡頭 4–5：AI 對話框與游標 ---------- */
const ANSWER = "根據目前可以取得的資料，這個問題可以從幾個面向來看。首先，事件的背景牽涉多方說法，各自引用的數據並不一致；其次，相關單位已陸續公布初步調查，但細節仍有待確認。整體而言，影響範圍可能比外界預期更大，後續發展也取決於政策回應的速度。此外，不同來源對時間點的描述有落差，部分說法彼此矛盾，需要比對原始文件，才能釐清真正的因果關係。";
const BOX = { x: 460, y: 250, w: 1000, h: 600 };
let ANSWER_LINES = null;
function layoutAnswer() {
  const maxW = BOX.w - 120, lines = []; let cur = "";
  ctx.save(); ctx.font = font(32, 400);
  for (const ch of ANSWER) { if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch; }
  lines.push(cur); ctx.restore();
  ANSWER_LINES = lines;
}
const CURSOR_REST = () => {
  // 回答產生完畢時，游標所在位置
  const li = ANSWER_LINES.length - 1;
  return [BOX.x + 60 + measure(ANSWER_LINES[li], 32) + 6, BOX.y + 196 + li * 52];
};
function sceneAI(t) {
  if (!ANSWER_LINES) layoutAnswer();
  const boxA = fade(t, 13.2, 13.8, 18.2, 19.0);
  const chars = Math.floor(clamp((t - 14.1) * 58, 0, ANSWER.length));
  // 對話框
  if (boxA > 0) {
    ctx.save(); ctx.globalAlpha = boxA;
    ctx.shadowColor = "rgba(26,26,26,.08)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
    rrect(BOX.x, BOX.y, BOX.w, BOX.h, 8); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.shadowColor = "transparent"; ctx.lineWidth = 2; ctx.strokeStyle = C.g6; ctx.stroke();
    // 使用者的提問
    const q = "這件事到底是怎麼回事？", qw = measure(q, 30) + 56;
    rrect(BOX.x + BOX.w - 60 - qw, BOX.y + 50, qw, 64, 8); ctx.fillStyle = C.g7; ctx.fill();
    text(q, BOX.x + BOX.w - 60 - qw / 2, BOX.y + 93, { size: 30, color: C.g2, align: "center" });
    // 逐字產生的回答
    let left = chars;
    ANSWER_LINES.forEach((ln, i) => {
      if (left <= 0) return;
      const s = ln.slice(0, left); left -= ln.length;
      text(s, BOX.x + 60, BOX.y + 196 + i * 52, { size: 32, color: C.g2 });
    });
    ctx.restore();
  }
  riseText("幾秒內", W / 2, 190, t, 14.6, { size: 96, weight: 900, align: "center", alpha: 1 - eInOut(prog(t, 18.0, 18.7)) }, .7);

  // 游標：先跟著文字跑，產生完畢後閃爍，再移到中央、變紅、倒下
  let cx, cy;
  if (chars < ANSWER.length) {
    let left = chars, li = 0;
    while (li < ANSWER_LINES.length - 1 && left > ANSWER_LINES[li].length) { left -= ANSWER_LINES[li].length; li++; }
    cx = BOX.x + 60 + measure(ANSWER_LINES[li].slice(0, left), 32) + 6; cy = BOX.y + 196 + li * 52;
  } else [cx, cy] = CURSOR_REST();
  const [rx, ry] = CURSOR_REST();
  const m = eInOut(prog(t, 19.3, 20.5));
  const tx = lerp(rx, 960, m), ty = lerp(ry, 610, m);
  if (t >= 19.3) { cx = tx; cy = ty; }
  if (t < 14.1) return;
  const blinking = chars >= ANSWER.length && t < 20.9;
  const on = !blinking || ((t - 17.3) % 1) < .55;
  const red = eInOut(prog(t, 21.0, 21.35));
  const fall = eInOut(prog(t, 21.6, 22.2));
  const grow = eOut(prog(t, 22.2, 22.7));
  const cursorA = t < 19.0 ? Math.max(boxA, 1) : 1;
  if (t > 23.9 || !on) return;
  ctx.save(); ctx.globalAlpha = cursorA;
  const len = lerp(40, 40, fall) + grow * 40;
  const wdt = lerp(4, 6, red);
  ctx.translate(cx, cy + 8);            // 以游標底部為支點倒下
  ctx.rotate(fall * Math.PI / 2);
  ctx.strokeStyle = mixHex(C.ink, C.red, red); ctx.lineWidth = wdt; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke();
  ctx.restore();
  riseText("判斷", 1000, 520, t, 22.5, { size: 180, weight: 900, align: "center", alpha: 1 - eInOut(prog(t, 23.2, 23.7)) }, .7);
}

/* ---------- 鏡頭 6：河流與 15 年 ---------- */
const RIVER = sampleBezier([
  [[160, 618], [380, 618], [420, 520], [640, 560]],
  [[640, 560], [860, 600], [900, 700], [1140, 650]],
  [[1140, 650], [1380, 600], [1440, 520], [1760, 560]]
], 80);
const riverAt = f => RIVER[Math.round(f * (RIVER.length - 1))];
function coverArt(c, w, h, o) {
  c.fillStyle = o.bg; c.fillRect(0, 0, w, h);
  c.fillStyle = C.ink; c.font = font(o.mast, 900, SERIF); c.textBaseline = "top"; c.fillText("天下", w * .08, h * .05);
  c.fillStyle = o.block; c.fillRect(w * .08, h * .3, w * .84, h * .42);
  c.strokeStyle = o.lineTone; c.lineWidth = Math.max(1, w / 90);
  c.beginPath(); c.moveTo(w * .08, h * .62); c.bezierCurveTo(w * .35, h * .5, w * .5, h * .7, w * .92, h * .55); c.stroke();
  if (o.title) { c.fillStyle = C.ink; c.font = font(o.titleSize, 900, SANS); c.fillText(o.title, w * .08, h * .77); }
  for (let i = 0; i < 2; i++) { c.fillStyle = C.g5; c.fillRect(w * .08, h * (.88 + i * .045), w * (i ? .4 : .6), h * .02); }
}
const COVER_1996 = offscreen(220, 290, (c, w, h) => coverArt(c, w, h, { bg: C.g8, mast: 40, block: C.g6, lineTone: C.g4, title: "環境台灣", titleSize: 26 }));
function stillArt(c, w, h, seed) {
  const r = rng(seed);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#E4E8EB"); g.addColorStop(1, "#C3CACF"); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = "#AEB6BC"; c.beginPath(); c.moveTo(0, h * .45);
  for (let x = 0; x <= w; x += w / 8) c.lineTo(x, h * (.35 + r() * .15)); c.lineTo(w, h); c.lineTo(0, h); c.fill();
  c.fillStyle = "#EEF1F3"; c.beginPath(); c.moveTo(w * .1, h); c.bezierCurveTo(w * .4, h * .7, w * .3, h * .55, w * .62, h * .5); c.lineTo(w * .7, h * .52); c.bezierCurveTo(w * .45, h * .62, w * .62, h * .78, w * .45, h); c.fill();
  c.fillStyle = "rgba(26,26,26,.5)"; c.font = font(14, 500); c.fillText("示意圖", w - 60, h - 12);
}
const STILL_2006 = offscreen(320, 180, (c, w, h) => stillArt(c, w, h, 3));
const STILL_2010 = offscreen(320, 180, (c, w, h) => stillArt(c, w, h, 11));
const NODES = [
  { f: .12, img: COVER_1996, w: 200, h: 264, year: "1996", title: "《環境台灣》" },
  { f: .44, img: STILL_2006, w: 320, h: 180, year: "2006", title: "看河十年後" },
  { f: .76, img: STILL_2010, w: 320, h: 180, year: "2010", title: "看河 III" }
];
function sceneRiver(t) {
  const out = 1 - eInOut(prog(t, 30.6, 31.1));
  // 游標倒下後的短線先滑到左側起點
  const slide = eInOut(prog(t, 23.4, 24.2));
  if (t < 24.2) {
    const x0 = lerp(960, 160, slide), y0 = lerp(618, 618, slide);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + 80, y0); redStroke(6); return;
  }
  ctx.save(); ctx.globalAlpha = out;
  const p = eInOut(prog(t, 24.2, 29.4));
  const head = .05 + .95 * p;
  polyline(RIVER, head); redStroke(6);
  NODES.forEach((n, i) => {
    if (head < n.f) return;
    const [x, y] = riverAt(n.f);
    const k = eOut(prog(t, 24.2 + 5.2 * n.f, 24.2 + 5.2 * n.f + .7));
    ctx.save(); ctx.globalAlpha *= k;
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fillStyle = C.red; ctx.fill();
    ctx.strokeStyle = C.g6; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x, y - 52); ctx.stroke();
    const top = y - 60 - n.h;
    ctx.shadowColor = "rgba(26,26,26,.12)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.drawImage(n.img, x - n.w / 2, top + (1 - k) * 16, n.w, n.h);
    ctx.restore();
    text(n.year, x, y + 76, { family: EN, size: 44, weight: 700, align: "center", alpha: out * k });
    text(n.title, x, y + 120, { size: 28, color: C.g2, align: "center", alpha: out * k });
  });
  ctx.restore();
  riseText("15 年", 1760, 800, t, 29.2, { size: 150, weight: 900, align: "right", alpha: out }, .8);
}

/* ---------- 鏡頭 7：誰堆出垃圾山？ ---------- */
const PHOTO = offscreen(1200, 820, (c, w, h) => {
  const r = rng(21);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#EEF1F3"); g.addColorStop(.6, "#DDE2E5"); g.addColorStop(1, "#C7CED3");
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = "#CDD3D7"; c.beginPath(); c.moveTo(0, 380);

/* ---------- 鏡頭 13：雜亂聲波收成一條直線 ---------- */
const WAVES = (() => { const r = rng(17); return Array.from({ length: 34 }, (_, i) => ({ y: 90 + i * 27 + r() * 10, f: [lerp(.006, .016, r()), lerp(.02, .05, r()), lerp(.06, .11, r())], ph: [r() * 6, r() * 6, r() * 6], sp: [lerp(1, 3, r()), lerp(2, 5, r()), lerp(4, 8, r())], amp: lerp(30, 80, r()), tone: [C.g6, C.g5, C.g4][Math.floor(r() * 3)] })); })();
function sceneWave(t) {
  if (t < 78.9 || t > 84.6) return;
  const wallA = fade(t, 79.0, 79.8, 80.0, 80.9);
  if (wallA > 0) { ctx.save(); ctx.globalAlpha = wallA * .9; drawWallTo(ctx, 8200); ctx.restore(); }

    for (let x = x0; x <= x1; x += 8) {
      const v = Math.sin(x * w.f[0] + w.ph[0] + t * w.sp[0]) * .5 + Math.sin(x * w.f[1] + w.ph[1] + t * w.sp[1]) * .35 + Math.sin(x * w.f[2] + w.ph[2] - t * w.sp[2]) * .25;

    }

    ctx.save(); ctx.globalAlpha = othersA;
    WAVES.forEach(w => { const y = lerp(w.y, 540, calm * .6); wavePath(w, y, amp(w, waveIn)); ctx.strokeStyle = w.tone; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke(); });
    ctx.restore();
  }
  // 主角：其中一條逐漸平穩，變成天下紅
  const main = WAVES[16];
  const x0 = lerp(0, 160, calm), x1 = lerp(W, 1760, calm);
  ctx.save(); ctx.globalAlpha = waveIn;
  wavePath(main, lerp(main.y, 540, calm), 90 * waveIn * (1 - calm), x0, x1);
  ctx.strokeStyle = mixHex(C.g4, C.red, eInOut(prog(t, 81.6, 82.6))); ctx.lineWidth = lerp(2.5, 6, calm); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
  ctx.restore();
  riseText("一束冷靜的聲音", W / 2, 470, t, 82.6, { size: 92, weight: 600, family: SERIF, align: "center", alpha: 1 - eInOut(prog(t, 84.0, 84.5)) }, .9);
}

/* ---------- 鏡頭 14–15：Logo 與標語 ---------- */
const TAG = "陪你，看懂天下。", TAG_SIZE = 76;
function sceneBrand(t) {
  if (t < 84.0) return;
  const tw = measure(TAG, TAG_SIZE, 600, SERIF);
  const m = eInOut(prog(t, 84.4, 85.6));
  const y = lerp(540, 722, m), x0 = lerp(160, W / 2 - tw / 2, m), x1 = lerp(1760, W / 2 + tw / 2, m);
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); redStroke(6);
  // Logo 位置先以文字標準字示意，正式版請換成品牌向量檔
  const la = eInOut(prog(t, 85.4, 86.6));
  text("天下雜誌", W / 2, 470, { size: 150, weight: 900, family: SERIF, align: "center", alpha: la, spacing: 12 });
  text("CommonWealth Magazine", W / 2, 540, { family: EN, size: 34, weight: 500, align: "center", color: C.g2, alpha: la, spacing: 6 });
  riseText(TAG, W / 2, 690, t, 87.0, { size: TAG_SIZE, weight: 600, family: SERIF, align: "center" }, 1.0);
}

/* ---------- 主繪製 ---------- */
function renderAt(t) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = "none";
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (t < 13.4) sceneOpen(t);
  if (t >= 13.1 && t < 24.0) sceneAI(t);
  if (t >= 23.3 && t < 31.2) sceneRiver(t);
  if (t >= 30.9 && t < 37.2) sceneMountain(t);
  if (t >= 36.9 && t < 44.1) sceneCheck(t);
  sceneTruth(t);
  sceneFlow(t);
  sceneCovers(t);
  sceneWave(t);
  sceneBrand(t);
  drawSubs(t);
  ctx.restore();
}

/* 確保所有用到的字都已載入（Google Fonts 的中文字依字元分批下載） */
async function loadFonts() {
  const all = [ANSWER, VO.map(v => v[2]).join(""), PARA.flat(2).join(""), "大量湧現知道得更多不等於看得更清楚幾秒內判斷這件事到底是怎麼回事？15年環境台灣看河十年後III誰堆出垃圾山？天下循線追查示意文字（非真實報導內容）人名數字時間花蓮震後追蹤：太魯閣上如何重建?示意數據真相解決的可能性微笑台灣護照123456789101112月助力審核編輯查證創刊號1981.6積極前瞻放眼天下追求更公平、美好的社會一束冷靜的聲音天下雜誌陪你，看懂天下。示意圖"].join("");
  const specs = [`400 40px ${SANS}`, `500 40px ${SANS}`, `700 40px ${SANS}`, `900 40px ${SANS}`, `600 40px ${SERIF}`, `900 40px ${SERIF}`, `400 40px ${EN}`, `500 40px ${EN}`, `700 40px ${EN}`];
  await Promise.all(specs.map(s => document.fonts.load(s, all).catch(() => {})));
  await document.fonts.ready;
}

/* ---------- 播放控制 ---------- */
const seek = document.getElementById("seek"), tcEl = document.getElementById("tc"), playBtn = document.getElementById("play");
let playing = false, t0 = 0, base = 0, cur = 0;
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
function show(t) { cur = t; renderAt(t); seek.value = t; tcEl.textContent = `${fmt(t)} / 1:30`; }
function tick(now) {
  if (!playing) return;
  const t = base + (now - t0) / 1000;
  if (t >= DURATION) { playing = false; playBtn.textContent = "重新播放"; show(DURATION); return; }
  show(t); requestAnimationFrame(tick);
}
playBtn.addEventListener("click", () => {
  if (playing) { playing = false; playBtn.textContent = "播放"; return; }
  base = cur >= DURATION ? 0 : cur; t0 = performance.now(); playing = true; playBtn.textContent = "暫停"; requestAnimationFrame(tick);
});
seek.addEventListener("input", () => { playing = false; playBtn.textContent = "播放"; show(+seek.value); });
document.getElementById("subs").addEventListener("change", e => { SHOW_SUBS = e.target.checked; show(cur); });

if (new URLSearchParams(location.search).has("render")) document.body.classList.add("render");
window.renderAt = renderAt;
window.setSubs = v => { SHOW_SUBS = v; };
window.ready = loadFonts().then(() => { layoutAnswer(); show(0); return true; });
</script>
